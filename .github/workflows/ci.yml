name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Backend Microservice Test Suite
  # ==========================================
  backend-test:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Test Suite
        working-directory: backend
        run: npm test

  # ==========================================
  # 2. Frontend React Web App Build & Lint
  # ==========================================
  frontend-build:
    name: Frontend React Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build

  # ==========================================
  # 2b. Demo Showcase Web App Build
  # ==========================================
  demo-build:
    name: Demo Showcase Web App Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        working-directory: demo
        run: npm ci

      - name: Build Demo Web Application
        working-directory: demo
        run: npm run build

  # ==========================================
  # 2c. Backend Container Build (Dockerfile regression guard)
  # ==========================================
  backend-docker-build:
    name: Backend Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Image
        run: docker build -t smart-reply-backend:ci ./backend

      - name: Smoke Test Image (health endpoint)
        run: |
          docker run -d --name smart-reply-ci -p 5006:5006 smart-reply-backend:ci
          healthy=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:5006/health > /dev/null; then
              healthy=1
              echo "Health check passed"
              break
            fi
            sleep 1
          done
          docker logs smart-reply-ci
          docker rm -f smart-reply-ci
          if [ "$healthy" != "1" ]; then
            echo "Container never became healthy" >&2
            exit 1
          fi

  # ==========================================
  # 3. Flutter Multiplatform Analysis & Tests
  # ==========================================
  flutter-ci:
    name: Flutter Analyze, Test & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: smart_reply_app
        run: flutter pub get

      - name: Analyze Static Analysis
        working-directory: smart_reply_app
        run: flutter analyze --fatal-infos

      - name: Run Unit & Widget Tests
        working-directory: smart_reply_app
        run: flutter test

      - name: Verify Web Build
        working-directory: smart_reply_app
        run: flutter build web --no-tree-shake-icons

  # ==========================================
  # 4. Native Win32 C++ Desktop Build
  # ==========================================
  desktop-cpp-build:
    name: Native Win32 C++ Desktop Build
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        working-directory: desktop
        run: cmake -B build -A x64

      - name: Build Executable (Release)
        working-directory: desktop
        run: cmake --build build --config Release

      - name: Verify Output Binary
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path "desktop/build" -Filter "SmartReplyAI.exe" -Recurse | Select-Object -First 1
          if ($bin -and (Test-Path $bin.FullName)) {
            Write-Host "C++ binary compiled successfully: $($bin.FullName)"
            Write-Host "Binary size: $($bin.Length) bytes"
          } else {
            Write-Host "Listing build directory contents:"
            Get-ChildItem -Path "desktop/build" -Recurse | Select-Object FullName
            Write-Error "Binary SmartReplyAI.exe was not found in desktop/build"
            exit 1
          }

  # ==========================================
  # 5. Native Desktop JSON Parser Unit Tests
  # ==========================================
  desktop-json-tests:
    name: Native Desktop JSON Parser Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run json_utils Tests (g++)
        working-directory: desktop
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            src/json_utils.cpp tests/json_utils_test.cpp -o json_utils_test
          ./json_utils_test

  # ==========================================
  # 6. Native HarmonyOS (ArkTS / ArkUI) Check
  # ==========================================
  harmonyos-native-check:
    name: Native HarmonyOS ArkTS Check & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Validate HarmonyOS Manifests and Resources
        run: |
          echo "Validating HarmonyOS Stage Model configuration..."
          # Parses every manifest, resolves $string/$media/$color/$profile
          # references, checks ArkTS entry points exist and rejects
          # buildOption.arkOptions fields that hvigor's schema refuses.
          node harmonyos/tools/validate_manifests.mjs
          echo "✓ HarmonyOS manifests, resources and ArkTS entry points verified!"

      - name: Package Native HarmonyOS Project
        run: |
          mkdir -p dist
          cd harmonyos
          zip -r ../dist/smart-reply-harmonyos-native.zip . -x ".*" -x "*/.*"
          ls -lh ../dist/smart-reply-harmonyos-native.zip
