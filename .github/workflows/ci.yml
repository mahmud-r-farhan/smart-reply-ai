name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Backend Microservice Test Suite
  # ==========================================
  backend-test:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Run Test Suite
        working-directory: backend
        run: npm test

  # ==========================================
  # 2. Frontend React Web App Build & Lint
  # ==========================================
  frontend-build:
    name: Frontend React Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build

  # ==========================================
  # 3. Flutter Multiplatform Analysis & Tests
  # ==========================================
  flutter-ci:
    name: Flutter Analyze, Test & Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: smart_reply_app
        run: flutter pub get

      - name: Analyze Static Analysis
        working-directory: smart_reply_app
        run: flutter analyze --fatal-infos

      - name: Run Unit & Widget Tests
        working-directory: smart_reply_app
        run: flutter test

      - name: Verify Web Build
        working-directory: smart_reply_app
        run: flutter build web --no-tree-shake-icons

  # ==========================================
  # 4. Native Win32 C++ Desktop Build
  # ==========================================
  desktop-cpp-build:
    name: Native Win32 C++ Desktop Build
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        working-directory: desktop
        run: cmake -B build -A x64

      - name: Build Executable (Release)
        working-directory: desktop
        run: cmake --build build --config Release

      - name: Verify Output Binary
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path "desktop/build" -Filter "SmartReplyAI.exe" -Recurse | Select-Object -First 1
          if ($bin -and (Test-Path $bin.FullName)) {
            Write-Host "C++ binary compiled successfully: $($bin.FullName)"
            Write-Host "Binary size: $($bin.Length) bytes"
          } else {
            Write-Host "Listing build directory contents:"
            Get-ChildItem -Path "desktop/build" -Recurse | Select-Object FullName
            Write-Error "Binary SmartReplyAI.exe was not found in desktop/build"
            exit 1
          }

  # ==========================================
  # 5. Huawei AppGallery & HarmonyOS Build Check
  # ==========================================
  huawei-harmonyos-check:
    name: Huawei AppGallery & HarmonyOS Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: smart_reply_app
        run: flutter pub get

      - name: Verify Huawei AppGallery Build Configuration
        run: |
          echo "Verifying Huawei Maven repository in gradle files..."
          grep -rn "developer.huawei.com/repo" smart_reply_app/android/settings.gradle.kts
          grep -rn "developer.huawei.com/repo" smart_reply_app/android/build.gradle.kts
          echo "Verifying Huawei & HarmonyOS metadata in AndroidManifest.xml..."
          grep -rn "hw_multiwindow_support" smart_reply_app/android/app/src/main/AndroidManifest.xml

      - name: Compile Huawei AppGallery Release APK
        working-directory: smart_reply_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Validate Generated APK
        run: |
          APK_FILE="smart_reply_app/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_FILE" ]; then
            echo "✓ Huawei AppGallery APK successfully built: $APK_FILE"
            ls -lh "$APK_FILE"
          else
            echo "❌ APK was not generated at expected path: $APK_FILE"
            exit 1
          fi
