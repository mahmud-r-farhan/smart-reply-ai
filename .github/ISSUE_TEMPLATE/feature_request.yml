name: Feature Request
description: Propose a new feature, model integration, or enhancement for SmartReply AI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea to make SmartReply AI even better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of the problem or limitation you're encountering.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: Add support for...
    validations:
      required: true
  - type: dropdown
    id: target_platforms
    attributes:
      label: Target Component / Platform
      description: Where should this feature be implemented?
      options:
        - All Clients (Cross-Platform)
        - Flutter App
        - Native C++ Desktop
        - Chrome Extension
        - Web App
        - Backend Service
      default: 0
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you've thought about.
