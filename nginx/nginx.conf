user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    # Rate Limiting Zones (High-throughput: 100 requests/sec per IP with 50 burst buffer)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:20m;

    # Upstream pool of backend microservice replicas
    upstream smart_reply_backend {
        least_conn; # Distribute load to replica with lowest active connections
        server backend:5006 max_fails=3 fail_timeout=5s;
        keepalive 128; # Maintain persistent connection pool to backends
    }

    server {
        listen 80;
        server_name localhost _;

        # Client body limit
        client_max_body_size 1m;
        client_body_buffer_size 128k;

        # Health probe pass-through without rate limit
        location /health {
            proxy_pass http://smart_reply_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # Readiness probe pass-through
        location /ready {
            proxy_pass http://smart_reply_backend/ready;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # Main API endpoints with rate-limiting and connection pooling
        location / {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn addr_limit 30;

            proxy_pass http://smart_reply_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # Clear Connection header to enable keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Low-latency proxy timeouts
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
